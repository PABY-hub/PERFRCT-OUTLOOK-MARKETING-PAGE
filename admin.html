<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin — Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .thumb {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body class="p-8 bg-gray-50">
    <!-- Password Login Modal -->
    <div
      id="login-modal"
      class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
    >
      <div class="bg-white p-8 shadow max-w-sm w-full">
        <h2 class="text-2xl font-bold mb-4">Admin Login</h2>
        <p class="text-gray-600 mb-6">
          Enter your password to access the admin panel
        </p>

        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">Password</label>
            <input
              id="password-input"
              type="password"
              required
              class="w-full border px-3 py-2"
              placeholder="Enter password"
              autofocus
            />
          </div>

          <button
            type="submit"
            class="w-full px-4 py-2 bg-black text-white hover:bg-gray-800 transition"
          >
            Login
          </button>
        </form>

        <p id="login-error" class="text-red-600 text-sm mt-4 hidden"></p>
      </div>
    </div>

    <!-- Admin Content (hidden until logged in) -->
    <div id="admin-content" class="hidden p-8 bg-gray-50">
      <div class="max-w-4xl mx-auto bg-white p-6 shadow">
        <div class="flex justify-between items-center mb-6">
          <h1 class="text-2xl font-bold">Admin — Manage Products</h1>
          <div class="flex gap-2">
            <a href="index.html" class="px-4 py-2 border">Open Store</a>
            <button
              id="logout-btn"
              class="px-4 py-2 bg-red-600 text-white hover:bg-red-700"
            >
              Logout
            </button>
          </div>
        </div>

        <form id="product-form" class="grid grid-cols-2 gap-4 mb-6">
          <input type="hidden" id="product-id" />

          <div class="col-span-2">
            <label class="block text-sm font-medium">Name</label>
            <input id="name" required class="w-full border px-3 py-2" />
          </div>

          <div>
            <label class="block text-sm font-medium">Category</label>
            <input id="category" class="w-full border px-3 py-2" />
          </div>

          <div>
            <label class="block text-sm font-medium">Price</label>
            <input
              id="price"
              type="number"
              step="0.01"
              class="w-full border px-3 py-2"
            />
          </div>

          <div class="col-span-2">
            <label class="block text-sm font-medium">Description</label>
            <textarea
              id="description"
              class="w-full border px-3 py-2"
              rows="2"
            ></textarea>
          </div>

          <div>
            <label class="block text-sm font-medium"
              >Sizes (comma separated)</label
            >
            <input
              id="sizes"
              class="w-full border px-3 py-2"
              placeholder="S,M,L"
            />
          </div>

          <div>
            <label class="block text-sm font-medium"
              >Colors (hex comma separated)</label
            >
            <input
              id="colors"
              class="w-full border px-3 py-2"
              placeholder="#000000,#ffffff"
            />
            <!-- Preset color swatches -->
            <div id="color-swatches" class="mt-3 grid grid-cols-10 gap-2"></div>
          </div>

          <div>
            <label class="block text-sm font-medium">Image</label>
            <input id="image" type="file" accept="image/*" class="w-full" />
          </div>

          <div>
            <label class="block text-sm font-medium">Or Pinterest URL</label>
            <input
              id="image-url"
              class="w-full border px-3 py-2"
              placeholder="https://pin.it/... or https://www.pinterest.com/..."
            />
          </div>

          <div class="col-span-2 flex gap-2">
            <button id="save-btn" class="px-4 py-2 bg-black text-white">
              Save
            </button>
            <button id="reset-btn" type="button" class="px-4 py-2 border">
              Reset
            </button>
          </div>
        </form>

        <h2 class="text-lg font-semibold mb-2">Existing Products</h2>
        <div id="products-list" class="space-y-3"></div>

        <h2 class="text-lg font-semibold mt-8 mb-2">View Pinterest For More</h2>
        <p class="text-sm text-gray-600 mb-4">
          Manage featured Pinterest pins to display on the store
        </p>
        <div id="pinned-list" class="space-y-3"></div>

        <h3 class="font-semibold mt-8 mb-4">Add Pinterest Pin</h3>
        <form id="pinned-form" class="grid grid-cols-2 gap-4 mb-6">
          <input type="hidden" id="pinned-id" />

          <div class="col-span-2">
            <label class="block text-sm font-medium">Pin Name</label>
            <input
              id="pinned-name"
              required
              class="w-full border px-3 py-2"
              placeholder="kingpisky"
            />
          </div>

          <div class="col-span-2">
            <label class="block text-sm font-medium">Pinterest URL</label>
            <input
              id="pinned-url"
              required
              class="w-full border px-3 py-2"
              placeholder="https://www.pinterest.com/search/pins/?q=fashion%20outfits&rs=ac&len=3&source_id=ac_uYyVYJpN&eq=fas&etslf=11414"
            />
          </div>

          <div class="col-span-2">
            <label class="block text-sm font-medium">Image</label>
            <a
              href="https://www.pinterest.com/search/pins/?q=fashion%20outfits"
              target="_blank"
              class="w-full border px-3 py-2 block text-center bg-red-50 text-red-600 hover:bg-red-100 font-medium rounded"
            >
              Visit Pinterest for Download
            </a>
          </div>
        </form>

        <h3 class="font-semibold mt-8 mb-4">Manage Lookbook Images</h3>
        <form id="lookbook-form" class="grid grid-cols-2 gap-4 mb-6">
          <input type="hidden" id="lookbook-id" />

          <div class="col-span-2">
            <label class="block text-sm font-medium">Caption (optional)</label>
            <input
              id="lookbook-caption"
              class="w-full border px-3 py-2"
              placeholder="Add a short caption"
            />
          </div>

          <div>
            <label class="block text-sm font-medium">Upload Image</label>
            <input
              id="lookbook-image"
              type="file"
              accept="image/*"
              class="w-full"
            />
          </div>

          <div class="col-span-2 flex gap-2">
            <button
              id="lookbook-save-btn"
              type="submit"
              class="px-4 py-2 bg-black text-white"
            >
              Save Lookbook Image
            </button>
            <button
              id="lookbook-reset-btn"
              type="button"
              class="px-4 py-2 border"
            >
              Reset
            </button>
          </div>
        </form>

        <div id="lookbook-list" class="space-y-3"></div>
      </div>
    </div>

    <script src="js/admin.js"></script>
  </body>
</html>
