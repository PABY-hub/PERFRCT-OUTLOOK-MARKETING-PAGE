<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin — Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .thumb {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body class="p-8 bg-gray-50">
    <div class="max-w-4xl mx-auto bg-white p-6 shadow">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Admin — Manage Products</h1>
        <a href="index.html" class="px-4 py-2 border">Open Store</a>
      </div>

      <form id="product-form" class="grid grid-cols-2 gap-4 mb-6">
        <input type="hidden" id="product-id" />

        <div class="col-span-2">
          <label class="block text-sm font-medium">Name</label>
          <input id="name" required class="w-full border px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium">Category</label>
          <input id="category" class="w-full border px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium">Price</label>
          <input
            id="price"
            type="number"
            step="0.01"
            class="w-full border px-3 py-2"
          />
        </div>

        <div class="col-span-2">
          <label class="block text-sm font-medium">Description</label>
          <textarea
            id="description"
            class="w-full border px-3 py-2"
            rows="2"
          ></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium"
            >Sizes (comma separated)</label
          >
          <input
            id="sizes"
            class="w-full border px-3 py-2"
            placeholder="S,M,L"
          />
        </div>

        <div>
          <label class="block text-sm font-medium"
            >Colors (hex comma separated)</label
          >
          <input
            id="colors"
            class="w-full border px-3 py-2"
            placeholder="#000000,#ffffff"
          />
        </div>

        <div>
          <label class="block text-sm font-medium">Image</label>
          <input id="image" type="file" accept="image/*" class="w-full" />
        </div>

        <div>
          <label class="block text-sm font-medium">Or Image URL</label>
          <input
            id="image-url"
            class="w-full border px-3 py-2"
            placeholder="https://..."
          />
        </div>

        <div class="col-span-2 flex gap-2">
          <button id="save-btn" class="px-4 py-2 bg-black text-white">
            Save
          </button>
          <button id="reset-btn" type="button" class="px-4 py-2 border">
            Reset
          </button>
        </div>
      </form>

      <h2 class="text-lg font-semibold mb-2">Existing Products</h2>
      <div id="products-list" class="space-y-3"></div>
    </div>

    <script src="js/admin.js"></script>
  </body>
</html>
